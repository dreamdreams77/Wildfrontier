<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wild Frontier — Wildlife Sanctuary</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #87ceeb;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 1;
        }

        .top-hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .hud-badge {
            background: rgba(18, 26, 20, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(127, 168, 115, 0.4);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            pointer-events: auto;
        }

        .hud-badge h1 {
            margin: 0;
            font-size: 0.95rem;
            color: #ffd700;
            text-transform: uppercase;
        }

        .game-panel {
            position: absolute;
            bottom: 75px;
            left: 15px;
            right: 15px;
            max-height: 50vh;
            background: rgba(18, 26, 20, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(127, 168, 115, 0.4);
            border-radius: 12px;
            padding: 15px;
            z-index: 10;
            overflow-y: auto;
            display: none;
        }

        .game-panel.active {
            display: block;
        }

        .bottom-nav {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .nav-btn {
            flex: 1;
            background: rgba(18, 26, 20, 0.9);
            border: 1px solid rgba(127, 168, 115, 0.4);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
        }

        .nav-btn.active {
            background: #7fa873;
            color: #121a14;
        }

        #error-log {
            position: absolute;
            top: 80px;
            left: 15px;
            right: 15px;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="error-log"></div>

    <div class="top-hud">
        <div class="hud-badge">
            <h1>Wild Frontier</h1>
            <p style="margin:2px 0 0; color:#aaa;">Sanctuary Active</p>
        </div>
        <div class="hud-badge" style="text-align: right;">
            <p style="margin:0; color:#7fa873;">RESTORATION</p>
            <b style="font-size: 0.9rem;">2,450 / 3,000</b>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <div id="panel-observe" class="game-panel active">
        <h3 style="margin:0 0 10px 0; color:#7fa873;">Wildlife Roster</h3>
        <p style="margin:5px 0; font-size: 0.85rem;">🦌 Juniper (Fawn) — <span style="color:#ffd700;">Injured • Tap to Care</span></p>
        <p style="margin:5px 0; font-size: 0.85rem;">🦊 Ember (Red Fox) — <span style="color:#7fa873;">Stable</span></p>
        <p style="margin:5px 0; font-size: 0.85rem;">🦝 Acorn (Raccoon) — <span style="color:#7fa873;">Foraging</span></p>
    </div>

    <div id="panel-track" class="game-panel">
        <h3 style="margin:0 0 10px 0; color:#7fa873;">Field Assignments</h3>
        <p style="font-size: 0.85rem; margin:0;">Assess Juniper in the clearing and stabilize rear leg injury.</p>
    </div>

    <div id="panel-care" class="game-panel">
        <h3 style="margin:0 0 10px 0; color:#7fa873;">Care Kit</h3>
        <button style="width:100%; padding:10px; background:#7fa873; border:none; font-weight:bold; border-radius:6px; cursor:pointer;" onclick="alert('Veterinary treatment applied!')">Apply Medical Treatment</button>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn active" onclick="showPanel('observe')">Observe</button>
        <button class="nav-btn" onclick="showPanel('track')">Track</button>
        <button class="nav-btn" onclick="showPanel('care')">Care Kit</button>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        window.onerror = function(msg, url, line) {
            const errBox = document.getElementById('error-log');
            errBox.style.display = 'block';
            errBox.innerText = "Error: " + msg + " (Line " + line + ")";
        };

        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Bright sky blue so you know it loaded

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 20);

        const renderer = new THREE.WebGLRenderer({ canvas: document.querySelector('#canvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // 2. Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xfff7e6, 1.2);
        sun.position.set(20, 40, 20);
        scene.add(sun);

        // 3. Terrain & Water Pond
        const terrain = new THREE.Mesh(
            new THREE.PlaneGeometry(80, 80, 30, 30).rotateX(-Math.PI / 2),
            new THREE.MeshStandardMaterial({ color: 0x4c7a2e, roughness: 0.9, flatShading: true })
        );
        scene.add(terrain);

        const pond = new THREE.Mesh(
            new THREE.CircleGeometry(8, 32).rotateX(-Math.PI / 2),
            new THREE.MeshStandardMaterial({ color: 0x2b7a9e, roughness: 0.1 })
        );
        pond.position.y = 0.05;
        scene.add(pond);

        // 4. Wildlife (Deer)
        const deer = new THREE.Group();
        const deerBody = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 2), new THREE.MeshStandardMaterial({ color: 0x8c5830 }));
        deerBody.position.y = 1;
        deer.add(deerBody);
        deer.position.set(-4, 0, 2);
        scene.add(deer);

        // UI Panel Switching
        function showPanel(name) {
            document.querySelectorAll('.game-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('panel-' + name).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Animation Loop
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            
            // Gentle camera orbit
            camera.position.x = Math.sin(time * 0.2) * 18;
            camera.position.z = Math.cos(time * 0.2) * 18;
            camera.lookAt(0, 1, 0);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
