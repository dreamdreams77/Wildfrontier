name: Deploy Wild Frontier to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Verify Pages entry and bundled assets
        shell: bash
        run: |
          test -s dist/index.html
          grep -q '/Wildfrontier/assets/.*\.js' dist/index.html
          grep -q '/Wildfrontier/assets/.*\.css' dist/index.html
          while IFS= read -r asset; do test -s "dist$asset"; done < <(grep -oE '/Wildfrontier/assets/[^" ]+\.(js|css)' dist/index.html | sed 's#^/Wildfrontier##')
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
